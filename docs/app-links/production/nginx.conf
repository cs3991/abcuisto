server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /.well-known/assetlinks.json {
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
