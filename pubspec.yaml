name: abcuisto
description: "Application to search for recipes from ABCuisto"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  equatable: ^2.0.7
  json_serializable: ^6.11.1
  json_annotation: ^4.9.0
  collection: ^1.19.1
  hydrated_bloc: ^11.0.0
  path_provider: ^2.1.6
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3
  infinite_scroll_pagination: ^5.1.1
  diacritic: ^0.1.6
  image_picker: ^1.2.1
  transparent_pointer: ^1.0.1
  http: ^1.6.0
  share_plus: ^11.1.0
  app_links: ^6.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.10.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png